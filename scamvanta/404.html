<body>
  <main><p class="label">SCAMVANTA · 404</p><h1>This trail ends here.</h1><p>The page may have moved, or the address may be mistyped. Your training progress stays in this browser.</p><a id="home-link" href="./index.html">Return to ScamVanta</a><p>ScamVanta screens use the navigation inside the app. You don’t need a separate page address for each lesson.</p></main>
  <script>
    // Recover the project root even when GitHub serves this page for a nested URL.
    const marker = '/scamvanta/';
    const position = location.pathname.indexOf(marker);
    if (position >= 0) document.getElementById('home-link').href = location.pathname.slice(0, position + marker.length) + 'index.html';
    else if (location.hostname.endsWith('.github.io')) document.getElementById('home-link').href = '/scamvanta/';
  </script>
